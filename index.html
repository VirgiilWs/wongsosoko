<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@wongsosoko</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2f2f2f;--ink:#fff;--card:#a3a3a3;--card-ink:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;justify-content:center;padding:36px 16px 40px}
main{width:100%;max-width:480px;text-align:center}
.avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px}
h1{font-size:22px;font-weight:700;margin:0 0 8px}
.bio{margin:0 auto 18px;font-size:15px;line-height:1.5;font-weight:500;max-width:420px}
.social{display:flex;justify-content:center;gap:20px;margin-bottom:32px}
.social a{color:var(--ink);display:block;line-height:0}
.social svg{width:30px;height:30px}
h2{font-size:15px;font-weight:700;margin:0 0 12px}
section{margin-bottom:28px}
a.card{position:relative;display:flex;align-items:center;min-height:66px;padding:10px 36px 10px 14px;background:var(--card);color:var(--card-ink);text-decoration:none;font-weight:500;font-size:15px;line-height:1.35;transition:filter .15s}
a.card:hover{filter:brightness(1.1)}
a.card:focus-visible,.social a:focus-visible{outline:3px solid #fff;outline-offset:3px}
.thumb{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:grid;place-items:center}
.thumb svg{width:44px;height:44px}
.thumb.kk img{height:36px;width:auto;display:block}
.body{flex:1;text-align:center;padding-left:44px;overflow-wrap:anywhere}
.sub{display:block;font-size:12px;color:#ececec;margin-top:2px}
.dots{position:absolute;right:13px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px}
.dots b{width:3px;height:3px;border-radius:50%;background:#e8e8e8}
@media (min-width:600px){body{padding-top:48px}.avatar{width:112px;height:112px}h1{font-size:26px}.bio{font-size:17px}.social svg{width:34px;height:34px}h2{font-size:17px}a.card{min-height:76px;font-size:17px}.sub{font-size:14px}}
@media (prefers-reduced-motion:reduce){a.card{transition:none}}
</style>
</head>
